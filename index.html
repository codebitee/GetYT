    <meta charset="UTF-8">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px 20px 50px 20px;
            display: flex;

        .container {
            width: 100%;
            max-width: 400px;
            background: #1e1e1e;
            padding: 20px;

            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.2);
        }
        .logo-container {

            margin-bottom: 20px;
        }
        .logo {
            display: inline-flex;

        }
        .logo-box {

        }
        .logo-text {
            color: #ffffff;

            display: flex;
            flex-direction: column;

        input[type="text"] {

        input[type="text"]:focus {

        }

        }
        
        /* Ad Space Container - Mothi keli ahe (Height 120px) */

            width: 100%;

        .download-wrapper {

            margin-top: auto; /* Ekdam khali footer chya var push karel */
            margin-bottom: 30px;

        /* Footer Links at bottom */

            font-size: 12px;

<body>

<div class="container">
    <div class="logo-container">
        <div class="logo">
            <span class="logo-box">Get</span><span class="logo-text">YT</span>
        </div>
    </div>
    
    <div class="input-group">
        <input type="text" id="urlInput" placeholder="Enter YouTube URL...">
        <button id="processBtn" class="action-btn" onclick="processVideo()">Process Video</button>
    </div>

    <div class="content-section">
        <div class="poster-box" id="posterContainer">
            Video Poster
        </div>

        <div class="options-box">
            <label>Format:</label>
            <div class="format-buttons">
                <button id="mp3Btn" onclick="selectFormat('mp3')">MP3</button>
                <button id="mp4Btn" onclick="selectFormat('mp4')" class="active">MP4</button>
            </div>

            <label>Quality & Size:</label>
            <div id="qualityList" style="display: flex; flex-direction: column; gap: 4px;">
                <span style="font-size: 11px; color: #777;">Process video first</span>
            </div>
        </div>
    </div>
</div>

<!-- Expanded Ad Space -->
<div class="ad-container">
    <span>Advertisement Space (Google AdSense / Banner)</span>
</div>

<!-- Download Button placed right above the footer -->
<div class="download-wrapper">
    <button class="action-btn download-btn" style="width: 100%;" onclick="downloadFile()">Download File</button>
</div>

<!-- Footer Links -->
<div class="page-footer">
    <a href="privacy.html" target="_blank">Privacy Policy</a> | 
    <a href="about.html" target="_blank">About Us</a> | 
    <a href="contact.html" target="_blank">Contact</a> | 
    <a href="more.html" target="_blank">More</a>
</div>

<script>
    let selectedFormat = 'mp4';
    let selectedQuality = '240p';

    function selectFormat(format) {
        selectedFormat = format;
        document.getElementById('mp3Btn').classList.toggle('active', format === 'mp3');
        document.getElementById('mp4Btn').classList.toggle('active', format === 'mp4');
        
        if(window.videoProcessed) {
            updateQualities();
        }
    }

    function updateQualities() {
        const qualityList = document.getElementById('qualityList');
        qualityList.innerHTML = '';
        
        let options = selectedFormat === 'mp3' 
            ? ['96 kbps (~2 MB)', '128 kbps (~4 MB)', '256 kbps (~8 MB)', '320 kbps (~12 MB)']
            : ['240p (~15 MB)', '480p (~45 MB)', '720p (~95 MB)', '1080p (~220 MB)'];

        selectedQuality = options[0].split(' ')[0];

        options.forEach((opt, index) => {
            let btn = document.createElement('button');
            btn.innerText = opt;
            btn.style.fontSize = '10px';
            btn.style.padding = '5px';
            btn.style.border = 'none';
            btn.style.borderRadius = '4px';
            btn.style.cursor = 'pointer';
            
            if (index === 0) {
                btn.style.background = '#ff0000';
                btn.style.color = 'white';
                btn.style.boxShadow = '0 0 8px rgba(255,0,0,0.5)';
            } else {
                btn.style.background = '#2a2a2a';
                btn.style.color = '#ccc';
            }

            btn.onclick = () => {
                document.querySelectorAll('#qualityList button').forEach(b => {
                    b.style.background = '#2a2a2a';
                    b.style.color = '#ccc';
                    b.style.boxShadow = 'none';
                });
                btn.style.background = '#ff0000';
                btn.style.color = 'white';
                btn.style.boxShadow = '0 0 8px rgba(255,0,0,0.5)';
                selectedQuality = opt.split(' ')[0];
            };
            qualityList.appendChild(btn);
        });
    }

    function processVideo() {
        const url = document.getElementById('urlInput').value;
        const btn = document.getElementById('processBtn');
        const posterContainer = document.getElementById('posterContainer');

        if(!url) {
            alert('Please enter a valid YouTube URL!');
            return;
        }

        btn.innerText = 'Processing...';
        posterContainer.innerHTML = 'Loading...';

        fetch('http://localhost:3000/api/info', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: url })
        })
        .then(res => res.json())
        .then(data => {
            btn.innerText = 'Process Video';
            if(data.thumbnail) {
                posterContainer.innerHTML = `<img src="${data.thumbnail}" alt="Thumbnail">`;
                window.videoProcessed = true;
                updateQualities();
            } else {
                posterContainer.innerHTML = 'Poster Not Found';
            }
        })
        .catch(err => {
            btn.innerText = 'Process Video';
            posterContainer.innerHTML = 'Error loading';
            console.error(err);
        });
    }

    function downloadFile() {
        const url = document.getElementById('urlInput').value;
        if(!url || !window.videoProcessed) {
            alert('Please enter and process a URL first!');
            return;
        }
        window.location.href = `http://localhost:3000/api/download?url=${encodeURIComponent(url)}&format=${selectedFormat}&quality=${selectedQuality}`;
    }
</script>

</body>
